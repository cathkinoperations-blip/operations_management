<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cathkin Estates - Fire Management Roadmap Playground</title>
<style>
    :root {
        --primary-color: #1e293b;
        --accent-color: #dc2626; /* Fire Red */
        --border-color: #e2e8f0;
        --card-bg: #ffffff;
        --bg-color: #faf8f5;
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #334155;
        background-color: var(--bg-color);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
    }

    .app-container {
        display: flex;
        gap: 20px;
        flex: 1;
        overflow: hidden;
        position: relative;
    }

    /* Left Control Panel with Horizontal Collapse */
    .control-panel {
        width: 350px;
        min-width: 350px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        overflow-y: auto;
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                    min-width 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                    padding 0.3s ease;
        box-sizing: border-box;
        position: relative;
    }

    /* Collapsed state (collapsed to the left by default) */
    .control-panel.collapsed {
        width: 48px;
        min-width: 48px;
        padding: 15px 8px;
        overflow: hidden;
        cursor: pointer;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .control-panel.collapsed .panel-header {
        flex-direction: column;
        gap: 20px;
        margin-bottom: 0;
        height: 100%;
        justify-content: flex-start;
    }

    .control-panel h2 {
        margin: 0;
        font-size: 1.1rem;
        color: var(--primary-color);
        white-space: nowrap;
    }

    .control-panel.collapsed h2 {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-size: 0.95rem;
        letter-spacing: 1px;
        margin-top: 10px;
    }

    .collapse-btn {
        background: #f1f5f9;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        cursor: pointer;
        color: #64748b;
        font-weight: bold;
        transition: background 0.2s, color 0.2s;
    }

    .collapse-btn:hover {
        background: #e2e8f0;
        color: var(--primary-color);
    }

    .collapse-content {
        display: flex;
        flex-direction: column;
        flex: 1;
        opacity: 1;
        transition: opacity 0.2s ease;
    }

    .control-panel.collapsed .collapse-content {
        display: none;
        opacity: 0;
    }

    .form-group {
        margin-bottom: 12px;
    }

    .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 4px;
        color: #475569;
    }

    .form-group input, .form-group textarea, .form-group select {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.85rem;
        box-sizing: border-box;
        background: white;
    }

    .form-group textarea {
        resize: vertical;
        height: 70px;
    }

    .btn {
        background-color: #dc2626;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        font-size: 0.9rem;
        transition: background-color 0.2s;
        margin-bottom: 8px;
    }

    .btn:hover { background-color: #b91c1c; }
    .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .chat-history {
        flex: 1;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background: #f8fafc;
        padding: 10px;
        overflow-y: auto;
        margin-bottom: 15px;
        font-size: 0.8rem;
        max-height: 130px;
    }

    .chat-msg {
        margin-bottom: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        line-height: 1.4;
    }

    .chat-msg.user { background-color: #e0f2fe; color: #0369a1; text-align: right; }
    .chat-msg.ai { background-color: #f1f5f9; color: #334155; }
    .chat-msg.error { background-color: #fee2e2; color: #991b1b; }

    .preview-panel {
        flex: 1;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
    }

    .preview-header h3 { margin: 0; color: var(--primary-color); font-size: 1rem; }

    #render-frame {
        width: 100%;
        flex: 1;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: white;
    }

    .loading-overlay {
        display: none;
        font-size: 0.85rem;
        color: #dc2626;
        font-weight: 600;
        text-align: center;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div class="app-container">
    <!-- Left-Collapsible Control Panel (Defaults to Collapsed) -->
    <div id="control-panel" class="control-panel collapsed">
        <div class="panel-header" onclick="handlePanelClick(event)">
            <h2 id="panel-title">AI Updates & Cloud Versioning</h2>
            <button id="collapse-icon" class="collapse-btn" onclick="togglePanel(event)" title="Expand Panel">▶</button>
        </div>

        <div class="collapse-content">
            <div class="form-group">
                <label for="model-select">Gemini Model</label>
                    <select id="model-select">
                        <option value="gemini-3.8-flash" selected>Gemini 3.8 Flash</option>
                        <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
                        <option value="gemini-3.1-pro">Gemini 3.1 Pro</option>
                        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
                    </select>
            </div>

            <div class="form-group">
                <label for="gh-repo">GitHub Repo (owner/repo)</label>
                <input type="text" id="gh-repo" value="cathkinoperations-blip/operations_management" placeholder="cathkinoperations-blip/operations_management" />
            </div>

            <div class="form-group">
                <label for="gh-token">GitHub Personal Access Token</label>
                <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" />
            </div>

            <div class="form-group">
                <label for="api-key">Gemini API Key</label>
                <input type="password" id="api-key" placeholder="Enter your Gemini API key" />
            </div>

            <div class="form-group">
                <label>Conversation Log</label>
                <div id="chat-history" class="chat-history">
                    <div class="chat-msg ai">Ready. Type instructions below to modify your fire roadmap.</div>
                </div>
            </div>

            <div class="form-group">
                <label for="user-prompt">Prompt Roadmap</label>
                <textarea id="user-prompt" placeholder="e.g., Move Spring Block Burns to late September"></textarea>
            </div>

            <button id="send-btn" class="btn" onclick="sendPrompt()">Update Roadmap</button>
            <button id="save-cloud-btn" class="btn" onclick="saveNewVersionToGitHub()" style="background-color: #1e293b;">Save New Version to Cloud</button>

            <div id="loading" class="loading-overlay">Gemini is updating your fire roadmap...</div>
        </div>
    </div>

    <div class="preview-panel">
        <div class="preview-header">
            <h3>Live Fire Roadmap Preview</h3>
            <button class="btn" style="width: auto; padding: 5px 10px; font-size: 0.75rem; margin-bottom: 0;" onclick="exportHTML()">Export HTML</button>
        </div>
        <iframe id="render-frame"></iframe>
    </div>
</div>

<script>
    let currentHTML = `<!DOCTYPE html><html><body style="font-family:sans-serif; padding:20px; color:#334155;"><h2>Loading Roadmap...</h2></body></html>`;

    window.onload = async function() {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) document.getElementById('api-key').value = savedKey;

        const savedToken = localStorage.getItem('gh_token');
        if (savedToken) document.getElementById('gh-token').value = savedToken;

        const savedRepo = localStorage.getItem('gh_repo');
        if (savedRepo) document.getElementById('gh-repo').value = savedRepo;

        await loadLatestRoadmap();
    };

    function togglePanel(event) {
        if (event) event.stopPropagation();
        const panel = document.getElementById('control-panel');
        const icon = document.getElementById('collapse-icon');
        
        panel.classList.toggle('collapsed');
        if (panel.classList.contains('collapsed')) {
            icon.innerText = '▶';
            icon.title = 'Expand Panel';
        } else {
            icon.innerText = '◀';
            icon.title = 'Collapse Panel';
        }
    }

    function handlePanelClick(event) {
        const panel = document.getElementById('control-panel');
        if (panel.classList.contains('collapsed')) {
            togglePanel(event);
        }
    }

    async function loadLatestRoadmap() {
        const historyEl = document.getElementById('chat-history');
        try {
            const localRes = await fetch('roadmaps/roadmap_2026-10-21.html');
            if (localRes.ok) {
                currentHTML = await localRes.text();
                updatePreview();
                historyEl.innerHTML += `<div class="chat-msg ai">Roadmap loaded successfully from local repository.</div>`;
                return;
            }
        } catch (e) {
            console.log('Local fetch failed.');
        }
        historyEl.innerHTML += `<div class="chat-msg error">Could not locate roadmap file inside roadmaps/ folder.</div>`;
    }

    function updatePreview() {
        const frame = document.getElementById('render-frame');
        const doc = frame.contentDocument || frame.contentWindow.document;
        doc.open();
        doc.write(currentHTML);
        doc.close();
    }

    function trimChatHistory() {
        const historyEl = document.getElementById('chat-history');
        const messages = historyEl.querySelectorAll('.chat-msg');
        if (messages.length > 10) {
            for (let i = 0; i < messages.length - 10; i++) {
                historyEl.removeChild(messages[i]);
            }
        }
    }

    async function sendPrompt() {
        const apiKey = document.getElementById('api-key').value.trim();
        const promptInput = document.getElementById('user-prompt');
        const prompt = promptInput.value.trim();
        const historyEl = document.getElementById('chat-history');
        const loadingEl = document.getElementById('loading');
        const sendBtn = document.getElementById('send-btn');
        const selectedModel = document.getElementById('model-select').value;

        if (!apiKey) { alert('Please enter your Gemini API Key.'); return; }
        if (!prompt) return;

        localStorage.setItem('gemini_api_key', apiKey);
        historyEl.innerHTML += `<div class="chat-msg user">${escapeHtml(prompt)}</div>`;
        promptInput.value = '';
        trimChatHistory();
        historyEl.scrollTop = historyEl.scrollHeight;

        loadingEl.style.display = 'block';
        sendBtn.disabled = true;

        const systemInstruction = "You are a specialized code-editing assistant. The user will provide instructions to modify an existing HTML fire roadmap table document. You must return ONLY the complete, valid updated HTML document, including all internal CSS and layout styles. Do not include markdown code block syntax in your response—output raw HTML text only.";

        const requestBody = {
            contents: [{ parts: [{ text: systemInstruction + "\n\nCurrent HTML Roadmap Document:\n" + currentHTML + "\n\nUser Instruction: " + prompt }] }]
        };

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            }); 

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`API Error (${response.status}): ${errText}`);
            }

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let newCode = data.candidates[0].content.parts[0].text;
                newCode = newCode.replace(/^```html\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/, '');
                currentHTML = newCode;
                updatePreview();
                historyEl.innerHTML += `<div class="chat-msg ai">Roadmap successfully updated locally.</div>`;
                trimChatHistory();
            } else {
                throw new Error('Invalid response structure from API.');
            }
        } catch (err) {
            historyEl.innerHTML += `<div class="chat-msg error">Error: ${escapeHtml(err.message)}</div>`;
            trimChatHistory();
        } finally {
            loadingEl.style.display = 'none';
            sendBtn.disabled = false;
            historyEl.scrollTop = historyEl.scrollHeight;
        }
    }

    async function saveNewVersionToGitHub() {
        const repo = document.getElementById('gh-repo').value.trim();
        const token = document.getElementById('gh-token').value.trim();
        const btnEl = document.getElementById('save-cloud-btn');

        if (!repo || !token) { alert('Please enter both your GitHub Repository and Personal Access Token.'); return; }

        localStorage.setItem('gh_token', token);
        localStorage.setItem('gh_repo', repo);
        btnEl.textContent = 'Saving New Version...';
        btnEl.disabled = true;

        try {
            const headers = { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${token}` };
            const now = new Date();
            const timestamp = now.toISOString().replace(/[:T]/g, '-').slice(0, 19);
            const fileName = `roadmaps/roadmap_${timestamp}.html`;
            const base64Content = btoa(unescape(encodeURIComponent(currentHTML)));

            const putRes = await fetch(`[https://api.github.com/repos/$](https://api.github.com/repos/$){repo}/contents/${fileName}`, {
                method: 'PUT',
                headers: headers,
                body: JSON.stringify({ message: `Add new version roadmap snapshot: ${timestamp}`, content: base64Content })
            });

            if (!putRes.ok) {
                const errJson = await putRes.json();
                throw new Error(errJson.message || 'Failed to upload version file to GitHub.');
            }
            alert(`Successfully saved new version as '${fileName}' to GitHub!`);
        } catch (err) {
            alert('GitHub Versioning Error: ' + err.message);
        } finally {
            btnEl.textContent = 'Save New Version to Cloud';
            btnEl.disabled = false;
        }
    }

    function exportHTML() {
        const blob = new Blob([currentHTML], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'fire_roadmap_snapshot.html';
        a.click();
        URL.revokeObjectURL(url);
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }
</script>

</body>
</html>
