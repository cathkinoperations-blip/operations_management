<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cathkin Estates - Fire Management Playground</title>
<style>
    :root {
        --primary-color: #1e293b;
        --accent-color: #b91c1c;
        --border-color: #e2e8f0;
        --card-bg: #ffffff;
        --bg-color: #faf8f5;
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #334155;
        background-color: var(--bg-color);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
    }

    .app-container {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 20px;
        flex: 1;
        overflow: hidden;
    }

    .control-panel {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        overflow-y: auto;
    }

    .control-panel h2 {
        margin-top: 0;
        font-size: 1.2rem;
        color: var(--primary-color);
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 5px;
        color: #475569;
    }

    .form-group input, .form-group textarea, .form-group select {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.85rem;
        box-sizing: border-box;
        background: white;
    }

    .form-group textarea {
        resize: vertical;
        height: 80px;
    }

    .btn {
        background-color: var(--accent-color);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        font-size: 0.9rem;
        transition: background-color 0.2s;
        margin-bottom: 8px;
    }

    .btn:hover {
        background-color: #991b1b;
    }

    .btn:disabled {
        background-color: #94a3b8;
        cursor: not-allowed;
    }

    .chat-history {
        flex: 1;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background: #f8fafc;
        padding: 10px;
        overflow-y: auto;
        margin-bottom: 15px;
        font-size: 0.8rem;
        max-height: 150px;
    }

    .chat-msg {
        margin-bottom: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        line-height: 1.4;
    }

    .chat-msg.user {
        background-color: #fef2f2;
        color: #991b1b;
        text-align: right;
    }

    .chat-msg.ai {
        background-color: #f1f5f9;
        color: #334155;
    }

    .chat-msg.error {
        background-color: #fee2e2;
        color: #991b1b;
    }

    .preview-panel {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
    }

    .preview-header h3 {
        margin: 0;
        color: var(--primary-color);
        font-size: 1rem;
    }

    #render-frame {
        width: 100%;
        flex: 1;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: white;
    }

    .loading-overlay {
        display: none;
        font-size: 0.85rem;
        color: #b91c1c;
        font-weight: 600;
        text-align: center;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div class="app-container">
    <div class="control-panel">
        <h2>AI Updates & Cloud Versioning</h2>
        
        <div class="form-group">
            <label for="model-select">Gemini Model</label>
            <select id="model-select">
                <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash-Lite</option>
                <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>    
            </select>
        </div>

        <div class="form-group">
            <label for="gh-repo">GitHub Repo (owner/repo)</label>
            <input type="text" id="gh-repo" value="cathkinoperations-blip/Fire-Management" placeholder="cathkinoperations-blip/Fire-Management" />
        </div>

        <div class="form-group">
            <label for="gh-token">GitHub Personal Access Token</label>
            <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" />
        </div>

        <div class="form-group">
            <label for="api-key">Gemini API Key</label>
            <input type="password" id="api-key" placeholder="Enter your Gemini API key" />
        </div>

        <div class="form-group">
            <label>Conversation Log</label>
            <div id="chat-history" class="chat-history">
                <div class="chat-msg ai">Ready. Type instructions below to modify your fire roadmap.</div>
            </div>
        </div>

        <div class="form-group">
            <label for="user-prompt">Prompt Roadmap</label>
            <textarea id="user-prompt" placeholder="e.g., Move Spring Block Burns to late September"></textarea>
        </div>

        <button id="send-btn" class="btn" onclick="sendPrompt()">Update Roadmap</button>
        <button id="save-cloud-btn" class="btn" onclick="saveNewVersionToGitHub()">Save New Version to Cloud</button>

        <div id="loading" class="loading-overlay">Gemini is updating your fire roadmap...</div>
    </div>

    <div class="preview-panel">
        <div class="preview-header">
            <h3>Live Fire Roadmap Preview</h3>
            <button class="btn" style="width: auto; padding: 5px 10px; font-size: 0.75rem; margin-bottom: 0;" onclick="exportHTML()">Export HTML</button>
        </div>
        <iframe id="render-frame"></iframe>
    </div>
</div>

<script>
    // State variable holding current HTML document content
    let currentHTML = "";

    window.onload = async function() {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) document.getElementById('api-key').value = savedKey;

        const savedToken = localStorage.getItem('gh_token');
        if (savedToken) document.getElementById('gh-token').value = savedToken;

        const savedRepo = localStorage.getItem('gh_repo');
        if (savedRepo) document.getElementById('gh-repo').value = savedRepo;

        await loadLatestRoadmapFromGitHub();
    };

    /**
     * Modular GitHub Fetching:
     * Queries /fire/roadmaps directory in GitHub repository, picks the latest snapshot by sorting filenames descending,
     * or falls back to local relative path if GitHub API is unreachable or token isn't set yet.
     */
    async function loadLatestRoadmapFromGitHub() {
        const repo = document.getElementById('gh-repo').value.trim();
        const token = document.getElementById('gh-token').value.trim();
        let loaded = false;

        if (repo) {
            try {
                const headers = { 'Accept': 'application/vnd.github+json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const res = await fetch(`https://api.github.com/repos/${repo}/contents/fire/roadmaps`, { headers });
                if (res.ok) {
                    const files = await res.json();
                    // Sort descending to get the newest file (e.g. roadmap_2026-10-21.html)
                    const htmlFiles = files.filter(f => f.name.endsWith('.html')).sort((a, b) => b.name.localeCompare(a.name));
                    
                    if (htmlFiles.length > 0) {
                        const latestFileRes = await fetch(htmlFiles[0].download_url);
                        if (latestFileRes.ok) {
                            currentHTML = await latestFileRes.text();
                            loaded = true;
                            appendChatLog('ai', `Loaded latest cloud roadmap: ${htmlFiles[0].name}`);
                        }
                    }
                }
            } catch (e) {
                console.log('GitHub fetch skipped/failed, attempting local fallback.', e);
            }
        }

        // Fallback to local file if GitHub fetch did not populate currentHTML
        if (!loaded) {
            try {
                const localRes = await fetch('./fire/roadmaps/roadmap_2026-10-21.html');
                if (localRes.ok) {
                    currentHTML = await localRes.text();
                    appendChatLog('ai', 'Loaded initial baseline roadmap from local fire/roadmaps folder.');
                } else {
                    throw new Error('Local file not found');
                }
            } catch (err) {
                appendChatLog('error', 'Could not load roadmap from GitHub or local path. Please verify repository setup.');
            }
        }
        updatePreview();
    }

    function updatePreview() {
        const frame = document.getElementById('render-frame');
        const doc = frame.contentDocument || frame.contentWindow.document;
        doc.open();
        doc.write(currentHTML);
        doc.close();
    }

    function appendChatLog(type, text) {
        const historyEl = document.getElementById('chat-history');
        historyEl.innerHTML += `<div class="chat-msg ${type}">${escapeHtml(text)}</div>`;
        trimChatHistory();
        historyEl.scrollTop = historyEl.scrollHeight;
    }

    function trimChatHistory() {
        const historyEl = document.getElementById('chat-history');
        const messages = historyEl.querySelectorAll('.chat-msg');
        if (messages.length > 10) {
            for (let i = 0; i < messages.length - 10; i++) {
                historyEl.removeChild(messages[i]);
            }
        }
    }

    async function sendPrompt() {
        const apiKey = document.getElementById('api-key').value.trim();
        const promptInput = document.getElementById('user-prompt');
        const prompt = promptInput.value.trim();
        const loadingEl = document.getElementById('loading');
        const sendBtn = document.getElementById('send-btn');
        const selectedModel = document.getElementById('model-select').value;

        if (!apiKey) {
            alert('Please enter your Gemini API Key.');
            return;
        }
        if (!prompt) return;

        localStorage.setItem('gemini_api_key', apiKey);
        appendChatLog('user', prompt);
        promptInput.value = '';

        loadingEl.style.display = 'block';
        sendBtn.disabled = true;

        const systemInstruction = "You are a specialized code-editing assistant. The user will provide instructions to modify an existing Fire Management Roadmap HTML document. You must return ONLY the complete, valid updated HTML document, including all internal CSS and layout styles. Do not include markdown code block syntax (like ```html) in your response—output raw HTML text only.";

        const requestBody = {
            contents: [
                {
                    parts: [
                        { text: systemInstruction + "\n\nCurrent Fire Roadmap HTML Document:\n" + currentHTML + "\n\nUser Instruction: " + prompt }
                    ]
                }
            ]
        };

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            }); 

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`API Error (${response.status}): ${errText}`);
            }

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let newCode = data.candidates[0].content.parts[0].text;
                newCode = newCode.replace(/^```html\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/, '');
                
                currentHTML = newCode;
                updatePreview();
                appendChatLog('ai', 'Roadmap successfully updated locally.');
            } else {
                throw new Error(data.error ? data.error.message : 'Invalid response structure from API.');
            }
        } catch (err) {
            appendChatLog('error', `Error: ${err.message}`);
        } finally {
            loadingEl.style.display = 'none';
            sendBtn.disabled = false;
        }
    }

    async function saveNewVersionToGitHub() {
        const repo = document.getElementById('gh-repo').value.trim();
        const token = document.getElementById('gh-token').value.trim();
        const btnEl = document.getElementById('save-cloud-btn');

        if (!repo || !token) {
            alert('Please enter both your GitHub Repository and Personal Access Token.');
            return;
        }

        localStorage.setItem('gh_token', token);
        localStorage.setItem('gh_repo', repo);

        btnEl.textContent = 'Saving New Version...';
        btnEl.disabled = true;

        try {
            const headers = {
                'Accept': 'application/vnd.github+json',
                'Authorization': `Bearer ${token}`
            };

            // Saves into fire/roadmaps/roadmap_YYYY-MM-DD-HH-MM-SS.html
            const now = new Date();
            const timestamp = now.toISOString().replace(/[:T]/g, '-').slice(0, 19);
            const fileName = `fire/roadmaps/roadmap_${timestamp}.html`;

            const base64Content = btoa(unescape(encodeURIComponent(currentHTML)));

            const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${fileName}`, {
                method: 'PUT',
                headers: headers,
                body: JSON.stringify({
                    message: `Add new fire roadmap snapshot: ${timestamp}`,
                    content: base64Content
                })
            });

            if (!putRes.ok) {
                const errJson = await putRes.json();
                throw new Error(errJson.message || 'Failed to upload version file to GitHub.');
            }

            alert(`Successfully saved new version as '${fileName}' to GitHub!`);
            appendChatLog('ai', `Saved new version to GitHub: ${fileName}`);
        } catch (err) {
            alert('GitHub Versioning Error: ' + err.message);
            appendChatLog('error', `GitHub Save Error: ${err.message}`);
        } finally {
            btnEl.textContent = 'Save New Version to Cloud';
            btnEl.disabled = false;
        }
    }

    function exportHTML() {
        const blob = new Blob([currentHTML], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'fire_roadmap_snapshot.html';
        a.click();
        URL.revokeObjectURL(url);
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }
</script>

</body>
</html>
